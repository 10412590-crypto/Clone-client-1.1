<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Clone Client - Minecraft 1.21.11 Web Edition</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0c0e17; font-family: sans-serif; }
        #launcher-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #0f111a 0%, #1c1e2e 100%); z-index: 10; transition: opacity 0.5s ease; }
        .menu-box { background: rgba(20, 24, 41, 0.95); border: 2px solid #00ffcc; border-radius: 12px; padding: 40px; width: 420px; text-align: center; box-shadow: 0 0 30px rgba(0, 255, 204, 0.25); }
        h1 { color: #00ffcc; margin: 0 0 5px 0; font-size: 28px; }
        .subtitle { color: #5c627d; font-size: 14px; margin-bottom: 30px; font-style: italic; }
        .launcher-btn { display: block; width: 100%; background: #16192b; color: #ffffff; border: 1px solid #333952; padding: 15px; margin: 15px 0; cursor: pointer; border-radius: 6px; font-weight: bold; font-size: 16px; transition: 0.2s; }
        .launcher-btn:hover { background: #222741; border-color: #00ffcc; box-shadow: 0 0 15px rgba(0, 255, 204, 0.3); }
        .beta-tag { color: #ffaa00; font-size: 12px; }
        #game-container { width: 100%; height: 100%; display: none; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div id="launcher-ui">
        <div class="menu-box">
            <h1>New Clone Client</h1>
            <div class="subtitle">Eaglercraft 1.21.11 - Optimizado</div>
            <button class="launcher-btn" onclick="iniciarCliente('player_of_eaglercraft')">Player of Eaglercraft (Estable)</button>
            <button class="launcher-btn" onclick="iniciarCliente('eaglercraft_minecraft_premium')">Eaglercraft & Minecraft Premium <span class="beta-tag">[BETA]</span></button>
        </div>
    </div>
    <div id="game-container"><iframe id="minecraft-frame" src=""></iframe></div>
    <script src="classes.js"></script>
    <script>
        function iniciarCliente(seccionId) {
            if (typeof cloneClient !== 'undefined') {
                cloneClient.switchSection(seccionId);
                const frame = document.getElementById('minecraft-frame');
                if (seccionId === 'eaglercraft_minecraft_premium') {
                    frame.src = "https://eaglercraft.ru"; 
                } else {
                    frame.src = "https://eaglercraft.com"; 
                }
                document.getElementById('launcher-ui').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('launcher-ui').style.display = 'none';
                    document.getElementById('game-container').style.display = 'block';
                }, 500);
            } else {
            }
        }
    </script>
</body>
</html>
<classes.js></classes.js>
