<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Clone Client - Minecraft 1.21.11</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0c0e17; font-family: sans-serif; user-select: none; }
        
        /* 1. MENÚ PRINCIPAL ESTILO MINECRAFT 1.21.11 */
        #launcher-ui { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://minecraft.net') center/cover no-repeat;
            filter: backdrop-filter(blur(8px));
            -webkit-backdrop-filter: blur(8px);
            animation: panoramaMove 40s linear infinite alternate;
            z-index: 10; 
        }

        @keyframes panoramaMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .logo-container { position: relative; margin-bottom: 50px; text-align: center; }
        .mc-main-title { color: #ffffff; font-size: 64px; font-weight: 900; letter-spacing: 4px; font-family: 'Arial Black', Gadget, sans-serif; text-transform: uppercase; text-shadow: 4px 4px 0px #3f3f3f; }
        .splash-text { position: absolute; bottom: -20px; right: -30px; color: #ffff55; font-size: 18px; font-weight: bold; text-shadow: 2px 2px 0px #3f3f22; transform: rotate(-15deg); animation: splashPulse 0.5s ease-in-out infinite alternate; }

        @keyframes splashPulse {
            0% { transform: rotate(-15deg) scale(1); }
            100% { transform: rotate(-15deg) scale(1.1); }
        }

        .menu-box { width: 400px; text-align: center; }

        .launcher-btn { 
            display: block; 
            width: 100%; 
            background: #4a4a4a;
            color: #e0e0e0; 
            border: 2px solid #000000; 
            box-shadow: inset -2px -2px 0px #2a2a2a, inset 2px 2px 0px #6a6a6a;
            padding: 12px; 
            margin: 14px 0; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px; 
            text-shadow: 2px 2px 0px #222;
            box-sizing: border-box;
        }

        .launcher-btn:hover { 
            background: #62a832; 
            color: #ffffff;
            border-color: #ffffff;
            box-shadow: inset -2px -2px 0px #38611b, inset 2px 2px 0px #8cd94b;
        }

        .premium-btn { background: #2b2b2b; color: #7a7a7a; box-shadow: inset -2px -2px 0px #1a1a1a, inset 2px 2px 0px #3a3a3a; }
        .premium-btn:hover { background: #3b3b3b; color: #8a8a8a; border-color: #000000; box-shadow: inset -2px -2px 0px #1a1a1a, inset 2px 2px 0px #3a3a3a; }
        .beta-tag { color: #ffaa00; text-shadow: 1px 1px 0px #222; }
        .version-info { position: absolute; bottom: 10px; left: 10px; color: #ffffff; font-size: 14px; text-shadow: 1px 1px 2px #000; }

        /* 2. PANTALLA DE CARGA OFICIAL CON TU LOGO REQUERIDO */
        #loading-screen { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: none; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            background-color: #ffffff; 
            z-index: 5; 
        }
        
        .eagler-logo { 
            width: 320px; 
            height: auto; 
            margin-bottom: 40px; 
        }
        
        .progress-bar-container { width: 280px; height: 6px; background-color: #e0e0e0; border-radius: 3px; overflow: hidden; }
        .progress-bar-fill { width: 0%; height: 100%; background-color: #000000; border-radius: 3px; transition: width 0.3s ease-out; }

        /* CONTENEDOR PARA EL LIENZO REAL (CANVAS 3D) DE MINECRAFT */
        #canvas_container {
            width: 100%;
            height: 100%;
            display: none;
            background-color: #000;
        }
    </style>
</head>
<body>

    <!-- MENÚ PRINCIPAL -->
    <div id="launcher-ui">
        <div class="logo-container">
            <div class="mc-main-title">Minecraft</div>
            <div class="splash-text">1.21.11 Edition!</div>
        </div>

        <div class="menu-box">
            <button class="launcher-btn" onclick="iniciarCliente('player_of_eaglercraft')">
                Player of Eaglercraft (Estable)
            </button>
            
            <button class="launcher-btn premium-btn" onclick="iniciarCliente('eaglercraft_minecraft_premium')">
                Eaglercraft & Minecraft Premium <span class="beta-tag">[BETA]</span>
            </button>
        </div>

        <div class="version-info">Minecraft 1.21.11 / New Clone Client</div>
    </div>

    <!-- PANTALLA DE CARGA CON EL LOGO BLANCO -->
    <div id="loading-screen">
        <img class="eagler-logo" src="https://githubusercontent.com" alt="Eaglercraft Logo">
        <div class="progress-bar-container">
            <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
    </div>

    <!-- AQUÍ SE ENRAIZA EL MENÚ Y EL MUNDO 3D OFICIAL DE MINECRAFT -->
    <div id="canvas_container">
        <canvas id="crafterea_canvas" style="width:100%; height:100%;"></canvas>
    </div>

    <!-- ENLACE AL ARCHIVO JAVASCRIPT DE TRUCOS -->
    <script src="classes.js"></script>

    <!-- INYECTORES Y SCRIPTS DE ARRANQUE OFICIALES DE EAGLERCRAFT -->
    <script>
        function iniciarCliente(seccionId) {
            if (typeof cloneClient !== 'undefined') {
                cloneClient.switchSection(seccionId);
                
                // 1. Mostrar pantalla de carga oficial bajo tu logo
                document.getElementById('launcher-ui').style.display = 'none';
                document.getElementById('loading-screen').style.display = 'flex';

                const progressBar = document.getElementById('progress-fill');
                let progreso = 0;
                
                // Control dinámico de la barra de progreso
                const interval = setInterval(() => {
                    if (progreso < 95) {
                        progreso += Math.floor(Math.random() * 6) + 2;
                        if (progreso > 95) progreso = 95;
                        progressBar.style.width = progreso + '%';
                    }
                }, 100);

                // 2. INYECTOR MAESTRO DEL ENTORNO DE JUEGO (Carga los scripts core en el hilo principal)
                const scriptBase = document.createElement('script');
                scriptBase.src = "https://eaglercraft.ru"; // Lógica core gráfica original con Singleplayer
                
                scriptBase.onload = function() {
                    clearInterval(interval);
                    progressBar.style.width = '100%';
                    
                    // 3. Cuando el motor gráfico termine de cargar, oculta la carga y enciende el lienzo 3D
                    setTimeout(() => {
                        document.getElementById('loading-screen').style.display = 'none';
                        document.getElementById('canvas_container').style.display = 'block';
                        
                        // Inicialización oficial de las librerías WebGL de Eaglercraft para renderizar el menú
                        if (window.main) {
                            window.main(); // Dispara el arranque del menú y mundos locales
                            console.log("[Launcher] ¡Motor inicializado! Disparando mundos de Un Jugador y Multijugador.");
                        }
                    }, 400);
                };

                document.body.appendChild(scriptBase);
            }
        }
    </script>
</body>
</html>
